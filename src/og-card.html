<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;800&display=block" rel="stylesheet">
<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#2a1519}
.card{position:relative;width:1200px;height:630px;display:flex;background:radial-gradient(circle at 20% 30%,#4a2328 0,#2a1519 60%)}
.txt{flex:1;padding:70px 0 60px 76px;display:flex;flex-direction:column;justify-content:center;gap:22px;color:#fff6e5;font-family:Nunito,sans-serif}
.eye{font-weight:800;font-size:24px;letter-spacing:.24em;text-transform:uppercase;color:#f6c453}
h1{margin:0;font:400 128px/.92 'Lilita One',sans-serif;text-shadow:0 9px 0 #e2453c;letter-spacing:.01em}
.sub{font-weight:700;font-size:30px;line-height:1.3;color:#e9d3bd;max-width:560px}
.url{align-self:flex-start;margin-top:6px;background:#e2453c;color:#fff;font:400 30px 'Lilita One',sans-serif;padding:12px 26px;border-radius:14px;box-shadow:0 6px 0 #a02d27}
.shot{width:500px;height:630px;position:relative;overflow:hidden}
.shot img{position:absolute;width:720px;left:-110px;top:-742px}
.shot::before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(90deg,#2a1519 0,rgba(42,21,25,0) 90px)}
.lights{position:absolute;left:0;right:0;top:0;height:40px}
</style></head><body><div class="card">
<div class="txt">
  <div class="eye">Tinsel Patrol</div>
  <h1>DEFEND<br>THE TREE!</h1>
  <div class="sub">Tap the cats before they tear down your Christmas tree.</div>
  <div class="url">tinselpatrol.com</div>
</div>
<div class="shot"><img src="scene.png" alt=""></div>
</div></body></html>
